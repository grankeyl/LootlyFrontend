<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Lootly</title>
    <link rel="stylesheet" href="src/assets/fonts/SFProRounded/stylesheet.css">
    <link rel="dns-prefetch" href="//lootly.codes">
    <link rel="preconnect" href="https://lootly.codes" crossorigin>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      const initWebApp = () => {
        const FULLSCREEN_ALLOWED_PLATFORMS = ['ios', 'android']
        const webApp = window?.Telegram?.WebApp

        if (webApp) {
          webApp.expand()

          const withFullScreen =
            Number(webApp.version) >= 8 &&
            webApp.requestFullscreen &&
            FULLSCREEN_ALLOWED_PLATFORMS.includes(webApp.platform)

          if (withFullScreen) {
            webApp.requestFullscreen()
          }

          webApp.requestWriteAccess()
          webApp.disableVerticalSwipes()

          return true
        }
        return false
      }

      if (!initWebApp()) {
        const observer = new MutationObserver(() => {
          if (initWebApp()) {
            observer.disconnect()
          }
        })
        observer.observe(document, {
          childList: true,
          subtree: true
        })
        setTimeout(() => {
          initWebApp()
          observer.disconnect()
        }, 1000)
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

    <script>
      document.addEventListener('visibilitychange', () => {
      const hidden = document.hidden;
      document.documentElement.classList.toggle('paused', hidden);
    });
    </script>
  </body>
</html>
